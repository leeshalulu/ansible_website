---
- name: Install apache webserver
  hosts: webserver
  become: yes

  tasks:
    - name: Install Apache
      dnf:
        name: httpd
        state: present

    - name: Start and enable Apache
      service:
        name: httpd
        state: started
        enabled: yes

    - name: Create a simple index.html
      copy:
        content: "<h1>Welcome to AlmaLinux Web Server</h1>"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Open HTTP port in firewalld
      firewalld:
        service: http
        permanent: yes
        state: enabled
        immediate: yes

    
        

